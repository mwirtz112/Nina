<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWE 2026 CEO Flashcards</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      gap: 32px;
      padding: 24px;
    }

    .counter {
      font-size: 14px;
      color: #888;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .scene {
      width: min(420px, 90vw);
      height: min(520px, 70vh);
      perspective: 1200px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 20px;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* Front: photo */
    .card-front {
      background: #1a1a22;
      border: 1px solid #2a2a35;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-front .no-image {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      background: linear-gradient(135deg, #1a1a22 0%, #252535 100%);
      color: #3a3a50;
    }

    .flip-hint {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 20px;
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    /* Back: info */
    .card-back {
      background: linear-gradient(145deg, #1c1c28 0%, #13131d 100%);
      border: 1px solid #2a2a40;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      text-align: center;
      gap: 16px;
    }

    .card-back .company {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #7c6af5;
      background: rgba(124, 106, 245, 0.1);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(124, 106, 245, 0.25);
    }

    .card-back .name {
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 700;
      line-height: 1.2;
      color: #fff;
    }

    .card-back .title {
      font-size: clamp(13px, 2.5vw, 15px);
      color: #9090a8;
      line-height: 1.5;
      max-width: 320px;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #7c6af5, #a78bfa);
      border-radius: 2px;
    }

    /* Navigation */
    .nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #2a2a40;
      background: #1a1a28;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
      user-select: none;
    }

    .nav-btn:hover {
      background: #252535;
      border-color: #7c6af5;
    }

    .nav-btn:active {
      transform: scale(0.93);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .progress {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: min(420px, 90vw);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2a2a40;
      transition: background 0.2s;
      cursor: pointer;
    }

    .dot.active {
      background: #7c6af5;
    }

    .hint {
      font-size: 12px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="counter">
    Card <span id="current">1</span> of <span id="total">0</span>
  </div>

  <div class="scene" id="scene" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front" id="front">
        <img id="photo" src="" alt="" />
        <div class="flip-hint">click to flip</div>
      </div>
      <div class="card-face card-back" id="back">
        <div class="company" id="b-company"></div>
        <div class="divider"></div>
        <div class="name" id="b-name"></div>
        <div class="title" id="b-title"></div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">&#8592;</button>
    <button class="nav-btn" id="nextBtn" onclick="go(1)">&#8594;</button>
  </div>

  <div class="progress" id="dots"></div>

  <div class="hint">Use ← → arrow keys to navigate</div>

let index = 0;
let flipped = false;

const card = document.getElementById('card');
const photo = document.getElementById('photo');
const front = document.getElementById('front');
const bCompany = document.getElementById('b-company');
const bName = document.getElementById('b-name');
const bTitle = document.getElementById('b-title');
const currentEl = document.getElementById('current');
const totalEl = document.getElementById('total');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dotsEl = document.getElementById('dots');

totalEl.textContent = data.length;

// Build dots
data.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.onclick = () => goTo(i);
  dotsEl.appendChild(d);
});

function render() {
  const p = data[index];

  // Reset flip without animation
  card.style.transition = 'none';
  card.classList.remove('flipped');
  flipped = false;
  // Re-enable transition after reset
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      card.style.transition = '';
    });
  });

  // Set front image
  if (p.image) {
    photo.src = p.image;
    photo.style.display = 'block';
    // Remove any existing no-image div
    const existing = front.querySelector('.no-image');
    if (existing) existing.remove();
  } else {
    photo.style.display = 'none';
    let ni = front.querySelector('.no-image');
    if (!ni) {
      ni = document.createElement('div');
      ni.className = 'no-image';
      ni.textContent = '👤';
      front.insertBefore(ni, front.querySelector('.flip-hint'));
    }
  }

  // Set back
  bCompany.textContent = p.company;
  bName.textContent = p.name;
  bTitle.textContent = p.title;

  // Counter
  currentEl.textContent = index + 1;

  // Buttons
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === data.length - 1;

  // Dots
  dotsEl.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === index);
  });

  // Scroll active dot into view
  const activeDot = dotsEl.children[index];
  if (activeDot) activeDot.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function flipCard() {
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
}

function go(dir) {
  goTo(index + dir);
}

function goTo(i) {
  if (i < 0 || i >= data.length) return;
  index = i;
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
});

render();
</script>
